# Configuration AlphaRust du dépôt lui-même (« dogfooding » : `alpharust lint` doit passer).
# Les règles, fixtures et templates contiennent volontairement des exemples de violations.
profile = "strict"
exclude = [
  "todos/**",
  "Cargo.lock",
  "rules/**",
  "tests/**",
  "templates/**",
  # sources des atomes CSS pur (texte de templates : SVG xmlns, URL d'embed vidéo d'atomic)
  "tools/dsgen/ext_astro*.py",
  "sites/**",
  "docs/screenshots/**",
]
fail_on = "error"
