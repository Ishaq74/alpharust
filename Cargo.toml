[package]
name = "alpharust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "AlphaRust — moteur de règles (regex + checkers sémantiques), générateurs de projets, CLI, TUI et GUI web"
license = "MIT"
repository = "https://github.com/Ishaq74/alpharust"
readme = "README.md"

[lib]
name = "alpharust"
path = "src/lib.rs"

[[bin]]
name = "alpharust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.10"
walkdir = "2.5"
anyhow = "1.0"
toml = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
include_dir = "0.7.4"
dialoguer = "0.12.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.3"
sha2 = "0.10"
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
