[package]
name = "alpharust"
version = "0.1.0"
edition = "2021"
description = "AlphaRust — Fondation intégrale pour primitives, règles et génération"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
anyhow = "1"
