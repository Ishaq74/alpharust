[package]
name = "alpharust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "AlphaRust — moteur de règles (regex + checkers sémantiques), générateurs de projets, CLI, TUI et GUI web"
license = "MIT"
repository = "https://github.com/Ishaq74/alpharust"
readme = "README.md"

[lib]
name = "alpharust"
path = "src/lib.rs"

[[bin]]
name = "alpharust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
walkdir = "2.5"
anyhow = "1.0"
toml = "0.8"
ratatui = "0.28"
crossterm = "0.28"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
