# cargo-deny (https://embarkstudios.github.io/cargo-deny/) : alertes RustSec, licences, doublons et sources.
# CI : job « cargo-deny » de .github/workflows/ci.yml.

[graph]
all-features = false

[advisories]
# toute alerte RustSec (vulnérabilité, crate non maintenue, unsound) fait échouer la CI
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
