# Catalogue de composants AlphaRust — source de vérité du contrat de balisage.
# Chaque composant « core » existe dans les quatre cibles : Starwind (Tailwind), CSS pur (Astro),
# Blade (Laravel) et balises de gabarit (Django/Wagtail). Le test de parité (src/scaffold/catalog.rs)
# vérifie ce fichier contre les fichiers réels.

[meta]
contract = "data-slot"

[[component]]
name = "accordion"
kind = "core"
parts = ["Accordion", "AccordionContent", "AccordionItem", "AccordionTrigger"]
slots = ["accordion", "accordion-content", "accordion-item", "accordion-trigger"]

[[component]]
name = "alert"
kind = "core"
parts = ["Alert", "AlertDescription", "AlertTitle"]
slots = ["alert", "alert-description", "alert-title"]

[[component]]
name = "avatar"
kind = "core"
parts = ["Avatar", "AvatarFallback", "AvatarImage"]
slots = ["avatar", "avatar-fallback", "avatar-image"]

[[component]]
name = "badge"
kind = "core"
parts = ["Badge"]
slots = ["badge"]

[[component]]
name = "breadcrumb"
kind = "core"
parts = ["Breadcrumb", "BreadcrumbEllipsis", "BreadcrumbItem", "BreadcrumbLink", "BreadcrumbList", "BreadcrumbPage", "BreadcrumbSeparator"]
slots = ["breadcrumb", "breadcrumb-ellipsis", "breadcrumb-item", "breadcrumb-link", "breadcrumb-list", "breadcrumb-page", "breadcrumb-separator"]

[[component]]
name = "button"
kind = "core"
parts = ["Button"]
slots = ["button"]

[[component]]
name = "card"
kind = "core"
parts = ["Card", "CardAction", "CardContent", "CardDescription", "CardFooter", "CardHeader", "CardTitle"]
slots = ["card", "card-action", "card-content", "card-description", "card-footer", "card-header", "card-title"]

[[component]]
name = "checkbox"
kind = "core"
parts = ["Checkbox"]
slots = ["checkbox", "checkbox-input", "checkbox-label"]

[[component]]
name = "dialog"
kind = "core"
parts = ["Dialog", "DialogClose", "DialogContent", "DialogDescription", "DialogFooter", "DialogHeader", "DialogTitle", "DialogTrigger"]
slots = ["dialog", "dialog-close", "dialog-content", "dialog-description", "dialog-footer", "dialog-header", "dialog-title", "dialog-trigger"]
atom_only = ["dialog-backdrop"]

[[component]]
name = "input"
kind = "core"
parts = ["Input"]
slots = ["input"]

[[component]]
name = "kbd"
kind = "core"
parts = ["Kbd", "KbdGroup"]
slots = ["kbd", "kbd-group"]
atom_only = ["tooltip-content"]

[[component]]
name = "label"
kind = "core"
parts = ["Label"]
slots = ["label"]

[[component]]
name = "native-select"
kind = "core"
parts = ["NativeSelect", "NativeSelectOptGroup", "NativeSelectOption"]
slots = ["native-select", "native-select-icon", "native-select-optgroup", "native-select-option", "native-select-wrapper"]

[[component]]
name = "pagination"
kind = "core"
parts = ["Pagination", "PaginationContent", "PaginationEllipsis", "PaginationItem", "PaginationLink", "PaginationNext", "PaginationPrevious"]
slots = ["pagination", "pagination-content", "pagination-ellipsis", "pagination-item", "pagination-link", "pagination-next", "pagination-previous"]

[[component]]
name = "progress"
kind = "core"
parts = ["Progress"]
slots = ["progress"]

[[component]]
name = "separator"
kind = "core"
parts = ["Separator"]
slots = ["separator"]

[[component]]
name = "skeleton"
kind = "core"
parts = ["Skeleton"]
slots = ["skeleton"]

[[component]]
name = "spinner"
kind = "core"
parts = ["Spinner"]
slots = ["spinner"]

[[component]]
name = "switch"
kind = "core"
parts = ["Switch"]
slots = ["switch", "switch-button", "switch-label", "switch-toggle"]

[[component]]
name = "table"
kind = "core"
parts = ["Table", "TableBody", "TableCaption", "TableCell", "TableFoot", "TableHead", "TableHeader", "TableRow"]
slots = ["table", "table-body", "table-caption", "table-cell", "table-container", "table-foot", "table-head", "table-header", "table-row"]

[[component]]
name = "tabs"
kind = "core"
parts = ["Tabs", "TabsContent", "TabsList", "TabsTrigger"]
slots = ["tabs", "tabs-content", "tabs-list", "tabs-trigger"]

[[component]]
name = "textarea"
kind = "core"
parts = ["Textarea"]
slots = ["textarea"]

[[component]]
name = "tooltip"
kind = "core"
parts = ["Tooltip", "TooltipContent", "TooltipTrigger"]
slots = ["tooltip", "tooltip-content", "tooltip-trigger"]

# Composants d'atomic (Starwind) pas encore déclinés en CSS pur / Blade / Django.
# Tout nouveau composant doit être ajouté ici ou dans [[component]] : le test échoue sinon.
[extended]
starwind_only = ["alert-dialog", "aspect-ratio", "button-group", "carousel", "collapsible", "container", "dropdown", "dropzone", "image", "input-group", "input-otp", "item", "popover", "prose", "radio-group", "select", "sheet", "sidebar", "slider", "theme-toggle", "toast", "toggle", "video"]

# Écarts connus entre le DOM rendu par les atomes Starwind (dépôt atomic, repris tels quels) et le contrat.
# Mesurés par le script de parité runtime (docs/tests.md) ; tout autre écart est une erreur.
[known_gaps]
atoms_missing_slots = ["checkbox", "pagination-next", "pagination-previous", "switch", "tooltip-trigger"]
atoms_extra_slots = ["dialog-backdrop"]
atoms_slot_count_differs = ["pagination-link"]
