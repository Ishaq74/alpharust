name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# une nouvelle poussée sur la même PR annule le passage précédent (main garde tous ses passages)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · build · tests · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: "Paquet crates.io (cargo package : le crate publié se compile seul)"
        run: cargo package --locked
      - name: Tests (unitaires, intégration, CLI, GUI, générateurs)
        run: cargo test --all-targets
      - name: Kit partagé à jour (tools/dsgen régénère CSS pur, Blade, Django et catalog.toml)
        run: python3 tools/dsgen/gen_ds.py && git diff --exit-code templates/layers tools/dsgen/vitrine/locales.json && test -z "$(git status --porcelain templates/layers tools/dsgen/vitrine)"
      - name: tools/dsgen — ruff et pytest (fichiers de référence)
        run: |
          python3 -m pip install --quiet ruff pytest
          python3 -m ruff check tools/dsgen
          python3 -m pytest -q tools/dsgen/tests
      - name: Règles, exemples et profils valides
        run: ./target/release/alpharust check-rules
      - name: Auto-lint du dépôt (profil strict)
        run: ./target/release/alpharust lint --profile strict
      - name: Export SARIF
        run: ./target/release/alpharust lint --profile strict --sarif > alpharust.sarif
      - uses: actions/upload-artifact@v7
        with:
          name: alpharust-sarif
          path: alpharust.sarif

  cross-os:
    name: build · tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Tests
        run: cargo test --release --locked --all-targets

  msrv:
    name: MSRV (rust-version de Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Compilation avec la version minimale annoncée
        run: cargo check --locked --all-targets

  cargo-deny:
    name: cargo-deny (RustSec, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  generated-projects:
    name: projets générés pour de vrai (Astro · Laravel · Wagtail · Rust)
    runs-on: ubuntu-latest
    env:
      PGPW: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, sqlite3, pdo_sqlite
          tools: composer
      - name: Outils détectés
        run: cargo run --release -- doctor
      - name: Base de test PostgreSQL de la plateforme Astro
        env:
          PGPASSWORD: ${{ env.PGPW }}
        run: psql -h localhost -U postgres -c 'CREATE DATABASE ci_e2e_test'
      - name: Générations réelles (create-astro, plateforme Astro, composer + Breeze, wagtail, cargo new)
        env:
          ALPHARUST_E2E: "1"
          ALPHARUST_E2E_PG_URL: postgresql://postgres:${{ env.PGPW }}@localhost:5432/ci_e2e
        run: cargo test --release --test generators e2e -- --ignored --test-threads=1 --nocapture
