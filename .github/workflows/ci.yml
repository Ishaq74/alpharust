name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · build · tests · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Tests (unitaires, intégration, CLI, GUI, générateurs)
        run: cargo test --all-targets
      - name: Règles, exemples et profils valides
        run: ./target/release/alpharust check-rules
      - name: Auto-lint du dépôt (profil strict)
        run: ./target/release/alpharust lint --profile strict
      - name: Export SARIF
        run: ./target/release/alpharust lint --profile strict --sarif > alpharust.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: alpharust-sarif
          path: alpharust.sarif

  generated-projects:
    name: projets générés (Wagtail · Astro · Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, sqlite3, pdo_sqlite
          tools: composer
      - name: Générer les trois projets
        run: |
          cargo build --release
          ./target/release/alpharust generate wagtail ci-wagtail
          ./target/release/alpharust generate astro ci-astro
          ./target/release/alpharust generate laravel ci-laravel
      - name: Wagtail — migrations et tests
        working-directory: sites/ci-wagtail
        run: |
          python -m pip install -r requirements.txt
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Astro — build
        working-directory: sites/ci-astro
        run: |
          npm install
          npm run build
      - name: Laravel — tests
        working-directory: sites/ci-laravel
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan test
