name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · build · tests · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Tests (unitaires, intégration, CLI, GUI, générateurs)
        run: cargo test --all-targets
      - name: Règles, exemples et profils valides
        run: ./target/release/alpharust check-rules
      - name: Auto-lint du dépôt (profil strict)
        run: ./target/release/alpharust lint --profile strict
      - name: Export SARIF
        run: ./target/release/alpharust lint --profile strict --sarif > alpharust.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: alpharust-sarif
          path: alpharust.sarif

  generated-projects:
    name: projets générés pour de vrai (Astro · Laravel · Wagtail · Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, sqlite3, pdo_sqlite
          tools: composer
      - name: Outils détectés
        run: cargo run --release -- doctor
      - name: Générations réelles (create-astro, composer + Breeze, wagtail, cargo new)
        env:
          ALPHARUST_E2E: "1"
        run: cargo test --release --test generators e2e -- --test-threads=1 --nocapture
