name: Parité nocturne (6 combinaisons × 4 langues)

# Le même site généré pour de vrai sur les 6 combinaisons (Astro · Laravel · Wagtail × Starwind · CSS pur), avec
# --auth et les 4 langues, sans --theme-* (palette par défaut) : structure et pixels (site_parity.py), parcours de
# compte (site_auth.py) et accessibilité axe-core WCAG 2.1 AA en clair et en sombre (site_axe.py). Captures en artefacts.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  # et sur une PR qui touche au site généré ou aux scripts de contrôle
  pull_request:
    paths:
      - "tools/dsgen/**"
      - "templates/layers/**"
      - "src/scaffold/**"
      - "docs/screenshots/scripts/**"
      - ".github/workflows/nightly.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  parity:
    name: parité · comptes · axe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, sqlite3, pdo_sqlite
          tools: composer
      - name: Build
        run: cargo build --release --locked
      - name: Outils de contrôle (Playwright, Pillow, axe-core)
        run: |
          python -m pip install --quiet playwright pillow
          npm install --prefix "$RUNNER_TEMP/axe" axe-core@4
      - name: Générer et servir les 6 combinaisons
        run: bash docs/screenshots/scripts/serve_combos.sh "$RUNNER_TEMP/combos" "$PWD/target/release/alpharust"
      - name: Parité (35 pages × bureau/mobile)
        run: python docs/screenshots/scripts/site_parity.py out/parity 1
      - name: Parcours de compte
        if: ${{ !cancelled() }}
        run: python docs/screenshots/scripts/site_auth.py out/auth
      - name: Accessibilité axe-core (WCAG 2.1 AA, clair et sombre)
        if: ${{ !cancelled() }}
        env:
          AXE_JS: ${{ runner.temp }}/axe/node_modules/axe-core/axe.min.js
        run: python docs/screenshots/scripts/site_axe.py out/axe
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: parite-nocturne
          path: |
            out/
            ${{ runner.temp }}/combos/*.log
